<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <button class="glass-element glass-element--pill" type="button" aria-label="Botón de cristal horizontal"></button>

  <!-- Navegación por puntos -->
  <nav class="section-nav" id="section-nav">
    <a class="section-dot" href="#section-1" title="Fondo 1"></a>
    <a class="section-dot" href="#section-2" title="Fondo 2"></a>
    <a class="section-dot" href="#section-3" title="Fondo 3"></a>
    <a class="section-dot" href="#section-4" title="Fondo 4"></a>
  </nav>

  <!-- Secciones de fondo -->
  <section id="section-1" class="bg-section bg-section-1"></section>
  <section id="section-2" class="bg-section bg-section-2"></section>
  <section id="section-3" class="bg-section bg-section-3"></section>
  <section id="section-4" class="bg-section bg-section-4"></section>

  <button class="glass-element glass-element--square" type="button" aria-label="Botón de cristal cuadrado"></button>

  <button class="glass-element glass-element--round" type="button" aria-label="Botón de cristal redondo"></button>
</body>

</html>
