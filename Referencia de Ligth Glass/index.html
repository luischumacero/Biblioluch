<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Botón glass flotante -->
  <glass-element onclick="console.log('Luis Chumacero')" auto-size radius="28" depth="4" blur="2" strength="40"
    background-color="rgba(255,255,255,0.05)" chromatic-aberration="10" min-width="200" min-height="58">
    <button class="glass-button" type="button"></button>
  </glass-element>

  <!-- Navegación por puntos -->
  <nav class="section-nav" id="section-nav">
    <a class="section-dot active" href="#section-1" title="Fondo 1"></a>
    <a class="section-dot" href="#section-2" title="Fondo 2"></a>
    <a class="section-dot" href="#section-3" title="Fondo 3"></a>
    <a class="section-dot" href="#section-4" title="Fondo 4"></a>
  </nav>

  <!-- Secciones de fondo -->
  <section id="section-1" class="bg-section bg-section-1"></section>
  <section id="section-2" class="bg-section bg-section-2"></section>
  <section id="section-3" class="bg-section bg-section-3"></section>
  <section id="section-4" class="bg-section bg-section-4"></section>

  <script src="displacement-utils.js"></script>
  <script src="glass-element.js"></script>
  <script>
    // Resaltar el punto activo según el scroll
    const sections = document.querySelectorAll('.bg-section');
    const dots = document.querySelectorAll('.section-dot');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          dots.forEach(dot => dot.classList.remove('active'));
          const activeDot = document.querySelector(`.section-dot[href="#${id}"]`);
          if (activeDot) activeDot.classList.add('active');
        }
      });
    }, { threshold: 0.5 });

    sections.forEach(section => observer.observe(section));
  </script>

  <!-- Botón cuadrado con bordes redondeados -->
  <glass-element style="bottom: 40px; left: calc(50% - 80px)" auto-size radius="12" depth="10" blur="2" strength="100"
    chromatic-aberration="8" background-color="rgba(255, 255, 255, 0.05)" min-width="120" min-height="120">
    <button class="glass-button" type="button"></button>
  </glass-element>

  <!-- Botón redondo -->
  <glass-element style="bottom: 40px; left: calc(50% + 80px)" width="120" height="120" radius="60" depth="4" blur="2"
    strength="40" chromatic-aberration="8" background-color="rgba(255, 255, 255, 0.05)">
    <button class="glass-button" type="button"></button>
  </glass-element>
</body>

</html>
